name: CI

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "main" ]

jobs:
  test:
    name: Test (${{ matrix.platform }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            command: swift test --filter SMLocalPersistenceTests
          - platform: iOS
            command: >-
              xcodebuild test
              -scheme SMLocalPersistence-Package
              -destination 'platform=iOS Simulator,name=iPhone 17'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Package
        run: swift build

      - name: Test (${{ matrix.platform }})
        run: ${{ matrix.command }}
